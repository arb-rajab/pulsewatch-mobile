name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: typecheck
        run: npm run typecheck

      - name: eslint
        run: npm run lint

      - name: test
        run: |
          set -o pipefail
          npm test -- --ci 2>&1 | tee /tmp/test-output.txt

      # TEMPORARY debug step (to be removed once the flaky test failure is
      # diagnosed): posts the EXACT captured output of the step above (not a
      # fresh re-run, which can pass even when the original run flaked) as a
      # PR comment, since this sandbox can reach api.github.com but not the
      # Actions log-download redirect target.
      - name: debug - post captured test output on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_DEBUG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 60000 /tmp/test-output.txt > /tmp/test-output-trunc.txt
          jq -Rs '{body: ("### Debug: captured test step output\n```\n" + . + "\n```")}' /tmp/test-output-trunc.txt > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_DEBUG_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @/tmp/payload.json

      # --audit-level=high: at SDK 57, `expo`'s own build/CLI tooling
      # (@expo/config-plugins and friends — never shipped in the app
      # bundle) pulls in moderate-severity `decode-uri-component`/`uuid`
      # advisories with no fix available yet (see README). A high/critical
      # finding still fails the build; the known moderate ones don't block.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
