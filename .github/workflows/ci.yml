name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: typecheck
        run: npm run typecheck

      - name: eslint
        run: npm run lint

      - name: test
        run: npm test -- --ci

      # --audit-level=high: at SDK 57, `expo`'s own build/CLI tooling
      # (@expo/config-plugins and friends — never shipped in the app
      # bundle) pulls in moderate-severity `decode-uri-component`/`uuid`
      # advisories with no fix available yet (see README). A high/critical
      # finding still fails the build; the known moderate ones don't block.
      #
      # scripts/check-npm-audit.mjs wraps the raw `npm audit` check with a
      # small, dated allowlist for one specific high-severity finding
      # (node-forge / GHSA-86w9-cpqp-85rv, also dev-tooling-only — see the
      # script's own header and README's "Known issues") that has no
      # upstream fix yet. Any OTHER high/critical finding still fails this
      # step immediately, and the allowlist entry itself expires on a set
      # date so it can't silently become permanent.
      - name: npm audit
        run: node scripts/check-npm-audit.mjs

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
